<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main Office View</title>

  <style>
    html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

    /* The visible window */
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: crosshair;
      background: #000;
    }

    /* The wide image */
    #scene {
      height: 100%;
      width: auto;
      max-width: none;
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>

    <div id="viewport">
      <img
        id="scene"
        src="ASSETS/TEXTURES/OFFICE/office_top_layer.png"
        alt="Game Screen"
      >
    </div>

  <script>
    const viewport = document.getElementById("viewport");
    const scene = document.getElementById("scene");

    let targetX = 0;
    let currentX = 0;
    let maxPan = 0;

    function updateBounds() {
        maxPan = Math.max(0, scene.offsetWidth - viewport.clientWidth);

        // Start at the center of the image
        targetX = -maxPan / 2;
        currentX = targetX;
    }

    scene.addEventListener("load", updateBounds);
    window.addEventListener("resize", updateBounds);

    viewport.addEventListener("mousemove", (event) => {
      const rect = viewport.getBoundingClientRect();

      // Mouse position from 0 (left) to 1 (right)
      const mouseX = (event.clientX - rect.left) / rect.width;

      // Map the mouse position to the image's full range
      targetX = -mouseX * maxPan;
    });

    // Smooth movement
    function animate() {
      currentX += (targetX - currentX) * 0.12;
      scene.style.transform = `translateX(${currentX}px)`;
      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
